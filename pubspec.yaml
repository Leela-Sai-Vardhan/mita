name: mita
description: "Mita — Focus on what matters. Three tasks, one day."
publish_to: 'none'
version: 1.2.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Shared Preferences
  shared_preferences: ^2.2.3

  # Date/Time utilities
  intl: ^0.19.0

  # Animations
  flutter_animate: ^4.5.0

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Notifications & Background
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # File handling & sharing
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^9.0.0

  # URL Launcher (for battery settings)
  url_launcher: ^6.2.5
  app_settings: ^7.0.0
  in_app_update: ^4.2.5

  # Home Widget
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
