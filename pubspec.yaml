name: mita
description: "Mita — Focus on what matters. Three tasks, one day."
publish_to: 'none'
version: 2.0.1+12

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Shared Preferences
  shared_preferences: ^2.2.3

  # Date/Time utilities
  intl: ^0.19.0

  # Animations
  flutter_animate: ^4.5.0

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Notifications & Background
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # File handling & sharing
  path_provider: ^2.1.2
  file_picker: ^8.0.0
  share_plus: ^9.0.0

  # URL Launcher (for battery settings)
  url_launcher: ^6.2.5
  app_settings: ^7.0.0
  audioplayers: ^6.1.0
  in_app_update: ^4.2.5

  # Remote config (Vercel-hosted JSON)
  http: ^1.2.0

  # Home Widget
  home_widget: ^0.7.0
  in_app_review: ^2.0.9

  # AdMob
  google_mobile_ads: ^9.0.0

  # Lottie animations (All-done celebration + future drops)
  lottie: ^3.5.1

  # Charts
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/animations/

